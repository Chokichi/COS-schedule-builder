name: Fetch COS schedule

# Triggered by cron-job.org (GitHub's own cron is unreliable).
# cron-job.org → POST GitHub workflow_dispatch → this job fetches COS and commits.
#
# cron-job.org settings:
#   Title:  Fetch COS schedule
#   URL:    https://api.github.com/repos/Chokichi/COS-schedule-builder/actions/workflows/fetch-cos-schedule.yml/dispatches
#   Method: POST
#   Schedule: daily (e.g. 15:00 UTC ≈ 8am Pacific in PDT)
#   Request headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <github_pat_with_actions_and_contents_write>
#     X-GitHub-Api-Version: 2022-11-28
#     Content-Type: application/json
#   Request body:
#     {"ref":"main"}
#
# Token: fine-grained PAT on this repo with Actions (read/write) and Contents (read/write).
# Classic PAT: repo + workflow scopes.
# Store the token only in cron-job.org — never commit it.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-cos-schedule]

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch COS class schedule
        run: node scripts/fetch-cos-schedule.js

      - name: Commit updated snapshot
        run: |
          git add public/basic-schedule.html src/scheduleConfig.json
          if git diff --staged --quiet; then
            echo "No schedule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update COS class schedule snapshot"
          git push
