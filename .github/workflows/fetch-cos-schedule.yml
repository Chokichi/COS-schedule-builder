name: Fetch COS schedule

# Triggered by cron-job.org (GitHub's own cron is unreliable).
# cron-job.org → POST GitHub workflow_dispatch → this job scrapes COS and writes D1.
#
# cron-job.org settings:
#   Title:  Fetch COS schedule
#   URL:    https://api.github.com/repos/Chokichi/COS-schedule-builder/actions/workflows/fetch-cos-schedule.yml/dispatches
#   Method: POST
#   Schedule: daily (e.g. 15:00 UTC ≈ 8am Pacific in PDT)
#   Request headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <github_pat_with_actions_write>
#     X-GitHub-Api-Version: 2022-11-28
#     Content-Type: application/json
#   Request body:
#     {"ref":"main"}
#
# GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN       (Account / D1 edit)
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_D1_DATABASE     (optional, default cos-schedule)
#
# wrangler.toml database_id must match the D1 database (npx wrangler d1 create cos-schedule).

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-cos-schedule]

permissions:
  contents: read
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch COS class schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE: ${{ secrets.CLOUDFLARE_D1_DATABASE }}
        run: node scripts/fetch-cos-schedule.js
